<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Table</title>
<style>
  :root { --bg:#14171c; --panel:#1d2128; --text:#e8eaed; --muted:#8b93a1; --felt:#1f6b45; --felt2:#164f33; --accent:#f2b84b; --red:#d64545; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:8px; align-items:center; padding:8px 16px; background:var(--panel); }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  button { background:#2b313b; color:var(--text); border:1px solid #3a4250; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
  button:hover { background:#353d49; }
  button.primary { background:var(--accent); color:#222; border-color:var(--accent); font-weight:600; }
  button.danger { background:#7a2b2b; border-color:#7a2b2b; }
  input[type=text], input[type=number] { background:#0f1216; color:var(--text); border:1px solid #3a4250; border-radius:6px; padding:8px; font:inherit; }
  main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; padding:24px; min-width:0; }
  #table { position:absolute; inset:60px 90px 90px; border-radius:50%; background:radial-gradient(var(--felt), var(--felt2)); border:10px solid #3a2a1a; box-shadow:inset 0 0 40px #0006; }
  #center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; }
  #pot { font-weight:600; margin-bottom:8px; }
  #board { display:flex; gap:6px; justify-content:center; min-height:64px; }
  .card { width:44px; height:62px; background:#fff; color:#111; border-radius:5px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:700; font-size:18px; line-height:1.1; box-shadow:0 1px 3px #0008; }
  .card.red { color:var(--red); }
  .card.back { background:repeating-linear-gradient(45deg,#2a4f9c,#2a4f9c 4px,#1f3f80 4px,#1f3f80 8px); color:transparent; }
  .card.sm { width:34px; height:48px; font-size:14px; }
  .card.peek { opacity:.55; }
  .seat { position:absolute; transform:translate(-50%,-50%); width:120px; text-align:center; }
  .seat .box { background:var(--panel); border:2px solid #3a4250; border-radius:10px; padding:6px; }
  .seat.me .box { border-color:var(--accent); }
  .seat.folded { opacity:.4; }
  .seat .cards { display:flex; gap:3px; justify-content:center; margin-bottom:4px; min-height:48px; }
  .seat .pos { color:var(--muted); font-size:12px; }
  .seat .stack { font-weight:600; }
  .seat .act { color:var(--accent); font-size:12px; min-height:16px; }
  .btn-chip { display:inline-block; background:#fff; color:#111; border-radius:50%; width:18px; height:18px; font-size:11px; font-weight:700; line-height:18px; margin-left:4px; }
  .pot-chips { color:#ffe9a8; font-size:12px; min-height:16px; }
  aside { width:300px; background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #hud { padding:12px; border-bottom:1px solid #2b313b; line-height:1.7; }
  #hud b { color:var(--accent); }
  #log { flex:1; overflow:auto; padding:12px; color:var(--muted); font-size:12px; line-height:1.5; }
  #log .ans { color:var(--text); }
  #controls { background:var(--panel); padding:12px 16px; min-height:78px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
  #prompt-text { width:100%; text-align:center; color:var(--muted); }
  #picker { display:grid; grid-template-columns:repeat(13, 34px); gap:3px; }
  #picker button { padding:3px 0; font-size:12px; }
  #picker button.r { color:var(--red); }
  #picker button:disabled { opacity:.2; }
  #menu { margin:auto; text-align:center; }
  #menu button { margin:6px; padding:14px 24px; font-size:16px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Poker Table</h1>
  <label><input type="checkbox" id="peek"> Peek at bot cards</label>
  <button id="quit" class="danger">Quit game</button>
</header>
<main>
  <div id="stage">
    <div id="menu">
      <h2>Choose a mode</h2>
      <button class="primary" onclick="startGame('1')">Mode 1: Play vs bots</button>
      <button onclick="startGame('2')">Mode 2: Track a live game</button>
    </div>
    <div id="table" class="hidden">
      <div id="center"><div id="pot"></div><div id="board"></div></div>
    </div>
  </div>
  <aside>
    <div id="hud"></div>
    <div id="log"></div>
  </aside>
</main>
<div id="controls"></div>

<script>
const SUITS = {c:"♣", d:"♦", h:"♥", s:"♠"};
const RANKS = "AKQJT98765432".split("");
let state = {}, lastPromptKey = null, picked = [];

const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
const answer = v => { post("/answer", {value:v}); $("controls").innerHTML = ""; lastPromptKey = null; };
const startGame = m => post("/start", {mode:m}).then(() => { lastPromptKey = null; });
$("quit").onclick = () => answer("q");

function cardEl(c, cls="") {
  if (!c) return `<div class="card back ${cls}">?</div>`;
  const red = c[1]==="h" || c[1]==="d" ? "red" : "";
  return `<div class="card ${red} ${cls}"><span>${c[0]==="T"?"10":c[0]}</span><span>${SUITS[c[1]]}</span></div>`;
}

function renderTable(t) {
  const peek = $("peek").checked;
  $("pot").textContent = "Pot: " + t.pot;
  $("board").innerHTML = t.board.map(c => cardEl(c)).join("");
  document.querySelectorAll(".seat").forEach(e => e.remove());
  const n = t.seats.length;
  const order = t.seats.map(s => s.seat);
  const meIdx = order.indexOf(t.own_seat);
  t.seats.forEach((s, i) => {
    const slot = (i - meIdx + n) % n;               // me at the bottom, clockwise from there
    const ang = Math.PI/2 + slot * 2*Math.PI/n;
    const x = 50 + 56*Math.cos(ang), y = 50 + 62*Math.sin(ang);
    let cards;
    if (s.hand) cards = s.hand.map(c => cardEl(c, "sm")).join("");
    else if (s.bot_hand && peek && !s.folded) cards = s.bot_hand.map(c => cardEl(c, "sm peek")).join("");
    else if (s.folded) cards = "";
    else if (t.mode === "1") cards = cardEl(null, "sm") + cardEl(null, "sm");
    else cards = "";
    const el = document.createElement("div");
    el.className = "seat" + (s.seat===t.own_seat ? " me" : "") + (s.folded ? " folded" : "");
    el.style.left = x + "%"; el.style.top = y + "%";
    el.innerHTML = `<div class="cards">${cards}</div><div class="box">
      <div class="pos">Seat ${s.seat} · ${s.pos}${s.pos==="BTN" ? '<span class="btn-chip">D</span>' : ""}</div>
      <div class="stack">${s.stack}</div><div class="act">${s.action || ""}</div>
      <div class="pot-chips">${s.in_pot ? "in: " + s.in_pot : ""}</div></div>`;
    $("table").appendChild(el);
  });
}

function renderControls(p) {
  const c = $("controls");
  const key = JSON.stringify(p);
  if (key === lastPromptKey) return;            // don't rebuild while the user is typing
  lastPromptKey = key; picked = [];
  c.innerHTML = p ? `<div id="prompt-text">${p.text}</div>` : "";
  if (!p) return;
  const add = html => c.insertAdjacentHTML("beforeend", html);

  if (p.kind === "yn") {
    add(`<button class="primary" onclick="answer('Y')">Yes</button><button onclick="answer('N')">No</button>`);
  } else if (p.kind === "action") {
    const call = Math.min(p.to_call, p.stack);
    const size = f => Math.min(p.stack, Math.max(p.min_raise, Math.round(p.to_call + f*(p.pot + p.to_call))));
    add(`<button class="danger" onclick="answer('-1')">Fold</button>
         <button class="primary" onclick="answer('${call}')">${p.to_call===0 ? "Check" : "Call " + call}</button>
         <input type="number" id="amt" value="${Math.min(p.min_raise, p.stack)}" min="0" max="${p.stack}" style="width:90px">
         <button onclick="answer($('amt').value)">Bet / Raise</button>
         <button onclick="$('amt').value=${size(0.5)}">½ pot</button>
         <button onclick="$('amt').value=${size(1)}">Pot</button>
         <button onclick="answer('${p.stack}')">All-in ${p.stack}</button>`);
  } else if (p.kind === "ev") {
    add(`<input type="number" id="evamt" placeholder="raise amount" style="width:130px">
         <button class="primary" onclick="answer($('evamt').value)">Calculate EV</button>
         <button onclick="answer('0')">Done</button>`);
  } else if (p.kind === "cards") {
    add(`<div id="picked" style="min-width:60px"></div><div id="picker"></div>
         <button class="primary" id="ok" onclick="answer(picked.join(''))" disabled>OK</button>
         ${p.optional ? `<button onclick="answer('')">Mucked</button>` : ""}
         <button onclick="picked=[];refreshPicker(${p.count})">Clear</button>`);
    const used = new Set([...(state.table ? state.table.board : []), ...(state.table ? state.table.seats.flatMap(s => s.hand||[]) : [])]);
    let html = "";
    for (const s of "shdc") for (const r of RANKS) {
      const cd = r + s;
      html += `<button class="${s==="h"||s==="d" ? "r":""}" data-c="${cd}" ${used.has(cd)?"disabled":""}>${r==="T"?"10":r}${SUITS[s]}</button>`;
    }
    $("picker").innerHTML = html;
    $("picker").onclick = e => { const b = e.target.closest("button"); if (b && !b.disabled && picked.length < p.count) { picked.push(b.dataset.c); refreshPicker(p.count); } };
    refreshPicker(p.count);
  } else {
    add(`<input type="text" id="txt" style="width:260px" autofocus>
         <button class="primary" onclick="answer($('txt').value)">Submit</button>`);
    const t = $("txt"); t.onkeydown = e => { if (e.key==="Enter") answer(t.value); };
    t.focus();
  }
}
function refreshPicker(count) {
  $("picked").innerHTML = picked.map(c => cardEl(c, "sm")).join("");
  document.querySelectorAll("#picker button").forEach(b => b.classList.toggle("hidden", picked.includes(b.dataset.c)));
  $("ok").disabled = picked.length !== count;
}

function render() {
  const s = state;
  const playing = s.status && s.status !== "idle";
  $("menu").classList.toggle("hidden", playing);
  $("table").classList.toggle("hidden", !s.table);
  if (s.table) { s.table.mode = s.mode; renderTable(s.table); }
  const h = s.hud || {};
  $("hud").innerHTML = playing
    ? `Equity: <b>${h.equity ?? "–"}</b><br>EV call: <b>${h.ev_call ?? "–"}</b><br>EV raise: <b>${h.ev_raise ?? "–"}</b>` : "";
  const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
  log.innerHTML = (s.log || []).map(l => l.startsWith("›") ? `<div class="ans">${l}</div>` : `<div>${l}</div>`).join("");
  if (atBottom) log.scrollTop = log.scrollHeight;
  if (s.status === "finished" || s.status === "error") {
    if (lastPromptKey !== "end") {
      lastPromptKey = "end";
      $("controls").innerHTML = `<div>${s.status === "error" ? "The game crashed (see log)." : "Game ended."}</div>
        <button class="primary" onclick="startGame('1')">New game: mode 1</button><button onclick="startGame('2')">New game: mode 2</button>`;
    }
  } else renderControls(s.prompt);
}

async function poll() {
  try { state = await (await fetch("/state")).json(); render(); } catch (e) {}
  setTimeout(poll, 400);
}
poll();
</script>
</body>
</html>
